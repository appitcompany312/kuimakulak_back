version: "3.8"

services:
  app:
    image: kuima-kulak-app:latest
    container_name: kuima-kulak-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - elasticsearch
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/kuima_db
      - SPRING_DATASOURCE_USERNAME=kuima_user
      - SPRING_DATASOURCE_PASSWORD=kuima_pass
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200

  postgres:
    image: postgres:15
    container_name: kuima-postgres
    environment:
      POSTGRES_DB: kuima_db
      POSTGRES_USER: kuima_user
      POSTGRES_PASSWORD: kuima_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: kuima-elasticsearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data

volumes:
  pgdata:
  esdata:


