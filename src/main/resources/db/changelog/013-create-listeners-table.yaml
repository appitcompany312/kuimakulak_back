databaseChangeLog:
  - changeSet:
      id: 13
      author: nursultan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: listeners
      changes:
        - createSequence:
            sequenceName: listeners_seq
            startValue: 100
            incrementBy: 1
        - createTable:
            tableName: listeners
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    foreignKeyName: book_id_fk
                    referencedTableName: books
                    referencedColumnNames: id
              - column:
                  name: count_listeners
                  type: integer

