databaseChangeLog:
  - changeSet:
      id: 12
      author: nursultan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: historys
      changes:
        - createSequence:
            sequenceName: history_seq
            startValue: 100
            incrementBy: 1
        - createTable:
            tableName: historys
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    foreignKeyName: book_id_fk
                    referencedTableName: books
                    referencedColumnNames: id
              - column:
                  name: created_date
                  type: date
              - column:
                  name: podcast_id
                  type: bigint
                  constraints:
                    foreignKeyName: podcast_id_fk
                    referencedTableName: podcasts
                    referencedColumnNames: id
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: user_id_fk
                    referencedTableName: users
                    referencedColumnNames: id
