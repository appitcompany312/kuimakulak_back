databaseChangeLog:
  - changeSet:
      id: 5
      author: nursultan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: podcasts
      changes:
        - createSequence:
            sequenceName: podcast_seq
            startValue: 100
            incrementBy: 1
        - createTable:
            tableName: podcasts
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: publication_date
                  type: date
              - column:
                  name: audio_url
                  type: varchar(1000)
              - column:
                  name: banner_url
                  type: varchar(1000)
              - column:
                  name: description
                  type: varchar(1000)
              - column:
                  name: podcast_name
                  type: varchar(255)
              - column:
                  name: channel_id
                  type: bigint
                  constraints:
                    foreignKeyName: channel_id_fk
                    referencedTableName: channel
                    referencedColumnNames: id