databaseChangeLog:
  - changeSet:
      id: 8
      author: nursultan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: contributor_books
      changes:
        - createTable:
            tableName: contributor_books
            columns:
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    foreignKeyName: book_id_fk
                    referencedTableName: books
                    referencedColumnNames: id
              - column:
                  name: contributor_id
                  type: bigint
                  constraints:
                    foreignKeyName: contributor_id_fk
                    referencedTableName: contributors
                    referencedColumnNames: id