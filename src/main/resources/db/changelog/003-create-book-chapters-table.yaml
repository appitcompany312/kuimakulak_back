databaseChangeLog:
  - changeSet:
      id: 3
      author: nursultan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: book_chapters
      changes:
        - createSequence:
            sequenceName: chapter_seq
            startValue: 100
            incrementBy: 1
        - createTable:
            tableName: book_chapters
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    foreignKeyName: book_id_fk
                    referencedTableName: books
                    referencedColumnNames: id
              - column:
                  name: audio_url
                  type: varchar(500)
              - column:
                  name: chapter_name
                  type: varchar(255)
              - column:
                  name: chapter_number
                  type: varchar(255)
