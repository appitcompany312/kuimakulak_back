databaseChangeLog:
  - changeSet:
      id: 6
      author: nursultan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: contributors
      changes:
        - createSequence:
            sequenceName: contributor_seq
            startValue: 100
            incrementBy: 1
        - createTable:
            tableName: contributors
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: last_name
                  type: varchar(255)
              - column:
                  name: role
                  type: varchar(50)

