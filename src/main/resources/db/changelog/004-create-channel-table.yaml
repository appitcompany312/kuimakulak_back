databaseChangeLog:
  - changeSet:
      id: 4
      author: nursultan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: channel
      changes:
        - createSequence:
            sequenceName: channel_seq
            startValue: 100
            incrementBy: 1
        - createTable:
            tableName: channel
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: channel_author
                  type:  varchar(255)
              - column:
                  name: channel_name
                  type: varchar(255)


