databaseChangeLog:
  - changeSet:
      id: 11
      author: nursultan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: genre_books
      changes:
        - createTable:
            tableName: genre_books
            columns:
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    foreignKeyName: book_id_fk
                    referencedTableName: books
                    referencedColumnNames: id
              - column:
                  name: genre_id
                  type: bigint
                  constraints:
                    foreignKeyName: genre_id_fk
                    referencedTableName: genre
                    referencedColumnNames: id