databaseChangeLog:
  - changeSet:
      id: 20
      author: nursultan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: favorite-podcasts
      changes:
        - createTable:
            tableName: favorite-podcasts
            columns:
              - column:
                  name: favorites_id
                  type: bigint
                  constraints:
                    foreignKeyName: favorites_id_fk
                    referencedTableName: favorite
                    referencedColumnNames: id
              - column:
                  name: podcasts_id
                  type: bigint
                  constraints:
                    foreignKeyName: podcasts_id_fk
                    referencedTableName: books
                    referencedColumnNames: id