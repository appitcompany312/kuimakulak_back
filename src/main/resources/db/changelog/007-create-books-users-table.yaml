databaseChangeLog:
  - changeSet:
      id: 7
      author: nursultan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: books_users
      changes:
        - createTable:
            tableName: books_users
            columns:
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    foreignKeyName: book_id_fk
                    referencedTableName: books
                    referencedColumnNames: id
              - column:
                  name: users_id
                  type: bigint
                  constraints:
                    foreignKeyName: users_id_fk
                    referencedTableName: users
                    referencedColumnNames: id
