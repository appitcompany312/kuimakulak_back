databaseChangeLog:
  - changeSet:
      id: 1
      author: nursultan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: users
      changes:
        - createSequence:
            sequenceName: user_seq
            startValue: 100
            incrementBy: 1
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: joined_date
                  type: date
              - column:
                  name: apple_id
                  type: varchar(500)
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: last_name
                  type: varchar(255)
              - column:
                  name: google_id
                  type: varchar(500)
              - column:
                  name: image_url
                  type: varchar(1000)
              - column:
                  name: password
                  type: varchar(255)
              - column:
                  name: role
                  type: varchar(50)


