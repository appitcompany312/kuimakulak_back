name: Gradle CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permissions to gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build JAR
        run: ./gradlew build -x test
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: ./build/libs

      - name: Deploy and Verify Application
        env:
          SERVER_HOST: 62.171.147.215
          SERVER_USER: root
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Setup SSH key
          echo "${SSH_PRIVATE_KEY}" > private_key.pem
          chmod 600 private_key.pem

          # Use the key for SSH
          ssh -o StrictHostKeyChecking=no -i private_key.pem $SERVER_USER@$SERVER_HOST "
            # Your deployment commands from the original script go here...
            # e.g., mkdir -p /opt/kuimakulak/backup; systemctl stop kuimakulak.service; etc.
            # Note: You don't need 'sudo' because you are already root.
            set -e
            mkdir -p /opt/kuimakulak/backup /opt/kuimakulak/new
            if [ -f /opt/kuimakulak/KuimaKulak-0.0.1-SNAPSHOT.jar ]; then
              cp /opt/kuimakulak/KuimaKulak-0.0.1-SNAPSHOT.jar /opt/kuimakulak/backup/
            fi
          "
          scp -o StrictHostKeyChecking=no -i private_key.pem ./build/libs/KuimaKulak-0.0.1-SNAPSHOT.jar $SERVER_USER@$SERVER_HOST:/opt/kuimakulak/new/
          ssh -o StrictHostKeyChecking=no -i private_key.pem $SERVER_USER@$SERVER_HOST "
            set -e
            systemctl stop kuimakulak.service
            mv /opt/kuimakulak/new/KuimaKulak-0.0.1-SNAPSHOT.jar /opt/kuimakulak/
            systemctl start kuimakulak.service
            echo 'Waiting for application to start...'
            sleep 30
            if ! systemctl is-active --quiet kuimakulak.service; then exit 1; fi
            if ! netstat -tulpn | grep :8080; then exit 1; fi
            echo 'Deployment successful'
            rm -rf /opt/kuimakulak/new
          "
