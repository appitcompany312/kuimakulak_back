version: 2.1

parameters:
  docker-container:
    type: string
    default: "kuima-kulak-app"

jobs:
  install-docker-if-not-exists:
    docker:
      - image: circleci/node:14
    steps:
      - run:
          name: Install SSH and Configure
          command: |
            echo $SSH_PRIVATE_KEY | base64 --decode > ./privateKey.pem
            chmod 400 privateKey.pem
      - run:
          name: Install Docker if not exists
          command: |
            ssh -o "StrictHostKeyChecking=no" -i ./privateKey.pem ubuntu@$HOST '
              if ! command -v docker &> /dev/null; then
                sudo apt update &&
                sudo apt install -y docker.io docker-compose
              fi'

  build-image:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker Image
          command: |
            docker build -t << pipeline.parameters.docker-container >>:latest .
      - run:
          name: Compress Docker Image
          command: |
            docker save << pipeline.parameters.docker-container >>:latest | gzip > << pipeline.parameters.docker-container >>.tar.gz
      - persist_to_workspace:
          root: .
          paths:
            - << pipeline.parameters.docker-container >>.tar.gz
            - docker-compose.yml

  transfer-and-run:
    docker:
      - image: circleci/node:14
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install SSH and Configure
          command: |
            echo $SSH_PRIVATE_KEY | base64 --decode > ./privateKey.pem
            chmod 400 privateKey.pem
      - run:
          name: Stop Remote Docker Compose
          command: |
            ssh -o "StrictHostKeyChecking=no" -i ./privateKey.pem ubuntu@$HOST '
              if [[ -f docker-compose.yml ]]; then
                docker-compose down --rmi all -v
                rm -f docker-compose.yml
              fi'
      - run:
          name: Transfer files
          command: |
            scp -o "StrictHostKeyChecking=no" -i ./privateKey.pem << pipeline.parameters.docker-container >>.tar.gz docker-compose.yml ubuntu@$HOST:~/
      - run:
          name: Load Docker Image & Start App
          command: |
            ssh -o "StrictHostKeyChecking=no" -i ./privateKey.pem ubuntu@$HOST '
              gunzip -c << pipeline.parameters.docker-container >>.tar.gz | docker load
              rm << pipeline.parameters.docker-container >>.tar.gz
              docker-compose up -d
            '

workflows:
  deploy:
    jobs:
      - install-docker-if-not-exists:
          filters:
            branches:
              only: main
      - build-image:
          requires:
            - install-docker-if-not-exists
          filters:
            branches:
              only: main
      - transfer-and-run:
          requires:
            - build-image
          filters:
            branches:
              only: main
